[build]
  publish = "public"
  functions = "netlify/functions"

# Redirect all /api/* calls to the serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Serve index.html for any unmatched route (SPA fallback)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

  [build.environment]
  SECRETS_SCAN_OMIT_KEYS = "MYSQLPORT"
